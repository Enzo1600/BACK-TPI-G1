spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/001-fleet-catalog.sql,classpath:db/002-reservations.sql,classpath:db/003-automation.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
