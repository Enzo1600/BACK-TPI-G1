spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: fleet-service
server:
  port: ${SERVER_PORT:8081}

springdoc:
  paths-to-match: /api/v1/**

# SQL constraint messages may contain personal data; API errors are handled centrally.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

auxiruta:
  automation:
    enabled: ${AUXIRUTA_AUTOMATION_ENABLED:true}
