spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: assistance-service
server:
  port: ${SERVER_PORT:8082}

springdoc:
  paths-to-match: /api/v1/**

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

auxiruta:
  automation:
    enabled: ${AUXIRUTA_AUTOMATION_ENABLED:true}
