# Overrides de referencia implementados por RulesConfiguration desde fase 9.
# Complementa AuxiRuta-parametros-MVP.yml; no reemplaza su configuración completa.
# Assistance guarda el snapshot; Fleet recibe los tiempos de cada reserva en su contrato.
spring:
  config:
    activate:
      on-profile: demo
auxiruta:
  rules-version: AR-MVP-5-DEMO
  search:
    attempt-timeout-seconds: 60
    evaluation-interval-seconds: 2
    minimum-offer-window-seconds: 3
  fleet:
    hold-seconds: 10
  execution:
    dispatch-deadline-seconds: 20
